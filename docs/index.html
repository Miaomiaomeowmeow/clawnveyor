<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>克鸟驿站</title>
<!-- 克鸟驿站 Clawnveyor 看板模板：别直接打开这个文件。跑 python tools/build.py，它把 data/flow.json（没有就用 templates/ 的示例）塞进下面的 /*DATA*/，生成 发布/克鸟驿站.html -->
<style>
:root{--bg:#F0EEE6;--panel:#FAF9F5;--ink:#141413;--sub:#6B6A63;--line:#E3E1D8;--red:#D97757;--yellow:#F4D9C6;--green:#5E8C61}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.app{display:block;height:100vh;position:relative}
.yard{height:100vh}
.yard{position:relative;overflow:hidden;min-width:0}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block}
.brand{position:absolute;left:18px;top:16px;z-index:2;pointer-events:none}
.brand b{display:inline-block;background:var(--ink);color:#fff;font-size:20px;letter-spacing:2px;padding:7px 14px;box-shadow:4px 4px 0 var(--red)}
.brand span{display:block;margin-top:8px;font-size:12px;color:var(--sub);letter-spacing:1px}
.fps{position:absolute;right:14px;bottom:14px;top:auto;z-index:2;font:11px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.85);border:1px solid var(--line);padding:3px 8px;color:var(--sub)}
.route{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;gap:3px;background:#fff;border:2px solid var(--ink);padding:6px;box-shadow:4px 4px 0 var(--ink);max-width:calc(100% - 24px);overflow-x:auto}
.route button{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.route button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11px}
.route button.on{background:var(--yellow)}
.route .arr{align-self:center;color:#bbb;font-size:12px}
.route a{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 8px;font-size:12px;font-weight:700;white-space:nowrap;border:2px dashed var(--ink);margin-left:2px}
.route a:hover,.route button:hover{background:#FFF4CC}
.route em{font-style:normal;font-size:11px;font-weight:700;color:var(--red);margin-left:2px}
.route a i{background:#3D3D3A}.route a.use i{background:#D97757}
.tool{position:absolute;right:14px;top:44px;z-index:3;all:unset;cursor:pointer;font-size:12px;font-weight:700;background:#fff;border:2px solid var(--ink);padding:5px 10px;box-shadow:3px 3px 0 var(--red)}
.tool{position:absolute;right:14px;top:56px;z-index:3}
.tool.lang{top:96px;box-shadow:3px 3px 0 var(--ink)}
.pop{position:absolute;z-index:5;width:240px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px;font-size:12px;display:none}
.pop.on{display:block}
.pop b{display:block;font-size:14px;margin:0 22px 6px 0}
.pop p{margin:3px 0;color:var(--sub)}
.pop .x{all:unset;cursor:pointer;position:absolute;right:8px;top:6px;font-size:18px;line-height:1;color:var(--sub);padding:2px 4px}
.pop .go{all:unset;cursor:pointer;display:inline-block;margin-top:8px;font-weight:700;color:#fff;background:var(--ink);padding:5px 10px;text-decoration:none}
.pop .gp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pop .gp:empty{display:none}.pop .gp span{width:100%;font-weight:700;font-size:12px}
.pop .gp button{all:unset;cursor:pointer;border:2px solid var(--ink);padding:4px 9px;font-size:12px;font-weight:700;background:#fff}.pop .gp button.on{background:var(--ink);color:#fff}.pop .gp button.act{border-style:dashed}
.pop .cp textarea{width:100%;height:84px;margin-top:8px;font:11px/1.5 inherit;border:1px solid var(--line);padding:6px;resize:none;background:#FAF9F5;color:#3D3D3A}
.pop{width:280px}
.nx{display:grid;gap:6px;margin-bottom:20px}.nx[hidden]{display:none}
.nx a{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px dashed var(--ink);padding:8px 10px;color:var(--ink);text-decoration:none}
.nx a:hover{background:#FFF4CC}
.nx i{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900}
.nx p{margin:1px 0 0;font-size:11px;color:var(--sub)}
.nx b{font-size:13px}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-bottom:20px}
.fs{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:7px 10px;font-size:12px}
.fs:hover{border-color:var(--ink);background:#FFF8F3}
.fs i{font-style:normal;width:26px;height:22px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:11px}
.fs b{font-size:13px}.fs p{margin:1px 0 0;color:var(--sub);font-size:11px;line-height:1.45}
.fs em{font-style:normal;font-weight:700;color:#B5603F;white-space:nowrap}
.fs a{color:var(--ink);font-weight:700;font-size:11px;text-decoration:none;border:1px solid var(--ink);padding:1px 6px;white-space:nowrap}
.fa{text-align:center;color:#B4B1A7;font-size:13px;line-height:14px;height:14px}
.fsplit{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fgrp{border:2px solid #1E1C1A;border-radius:8px;padding:8px 6px 6px;position:relative;margin-top:10px}
.fgh{position:absolute;top:-10px;left:10px;background:#1E1C1A;color:#FAF9F5;font-size:12px;font-weight:800;padding:1px 8px;border-radius:4px}
.fgrp .fs{width:100%;box-sizing:border-box}
.fgn{font-size:12px;color:#8A877E;padding:6px 4px 0;line-height:1.5}
.fgrp.att{border-style:dashed;border-color:#8A877E;margin-left:14px}
.fgrp.att .fgh{background:#8A877E}
.fs.sub i{background:#8A877E!important;font-size:11px}
.fs.sub{padding-top:6px;padding-bottom:6px;margin-left:16px;width:calc(100% - 16px)!important;background:#F7F5EF}
.fsplit .fs{grid-template-columns:1fr;gap:2px}
.fsplit .fs.side{background:#F7F5EF}
.fs.off{background:#F1EFE9;color:#8A877E}.fs.off i{background:#B4B1A7!important}.fs.off em{color:#8A877E}.stl{gap:6px}
.stGo{all:unset;cursor:pointer;margin-top:6px;text-align:center;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:9px 12px;border-radius:6px}.stGo:hover{background:#E8682F}
.route button.off{color:#B4B1A7}.route button.off i{background:#B4B1A7}
/* 换装台：盖在右边面板上（手机上从下面拉上来） */
.diy{position:fixed;right:0;top:0;width:360px;height:100vh;z-index:20;background:var(--panel);border-left:2px solid var(--ink);overflow:auto;padding:16px 16px 40px;transform:translateX(105%);transition:transform .25s ease}
.diy.on{transform:none}
.diy h3{font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center}
.diy h4{font-size:12px;color:var(--sub);letter-spacing:1px;margin:18px 0 8px;display:flex;justify-content:space-between}
.diy h4 small{font-weight:400;letter-spacing:0}
.diy .x{all:unset;cursor:pointer;font-size:22px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;background:#fff;border:1px solid var(--line);position:relative}
.chip:hover{border-color:var(--ink)}
.chip.on{border:2px solid var(--ink);padding:4px 8px;box-shadow:2px 2px 0 var(--yellow)}
.chip s{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.chip .del{display:none;position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;line-height:16px;text-align:center}
.diy.tidy .chip .del{display:block}
.chip.add{border-style:dashed;color:var(--sub)}

.draw .pal{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.draw .pal button{all:unset;cursor:pointer;width:18px;height:18px;border:1px solid var(--line)}.draw .pal button.on{outline:2px solid var(--ink)}
.draw .grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;margin:4px 0}.draw .grid button{all:unset;cursor:pointer;width:16px;height:16px;background:#fff}
.sizeR{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin:6px 0}.sizeR input{flex:1}
.newset{border:1px dashed var(--line);padding:8px 8px 2px;margin-top:8px;background:#FBFAF6}
.newset .ai{margin:0 0 6px}.newset .chips{margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:28px;height:26px;border:1px solid var(--line);padding:0;background:#fff;cursor:pointer}
.row{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:12px;color:var(--sub)}
.ai{display:flex;gap:6px;margin-top:8px}
.ai input{flex:1;min-width:0;font:12px inherit;padding:6px 8px;border:1px solid var(--line)}
.ai button,.btn{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:6px 10px;background:var(--ink);color:#fff;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.msg{font-size:11px;color:var(--sub);margin-top:6px;min-height:14px}
.try{font-size:11px;color:var(--red);font-weight:700}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
.tag{position:absolute;z-index:1;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.94);border:1.5px solid #3D3D3A;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:600;color:#2A2A28;box-shadow:0 2px 6px rgba(20,20,19,.12)}
.tag::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-4px;border:4px solid transparent;border-top-color:#3D3D3A}
.tag.sign{background:#FBEEE5;border-color:#D97757}
.tag.sign::after{border-top-color:#D97757}
.tag.dim{opacity:.7;background:#F0EEE6;border-color:#B4B1A7}
.tag.dim::after{border-top-color:#B4B1A7}
/* 步骤牌：①…⑦ 全都一个样子 */
.tag.step{background:#3D3D3A;color:#FAF9F5;border:0;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 rgba(20,20,19,.18);z-index:2}
.tag.step::after{border-top-color:#3D3D3A}
.tag.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#D97757;color:#fff;display:grid;place-items:center;font-size:12px}
.tag.step small{font-weight:400;color:#D6D3C8;font-size:11px}
/* 提醒：要你做事的地方冒一个橙色的 ! */
.tag.alert{background:#D97757;color:#fff;border:0;border-radius:999px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:6px;animation:pulse 1.4s ease-in-out infinite;z-index:3}
.tag.alert::after{border-top-color:#D97757}
.tag.alert b{width:18px;height:18px;border-radius:50%;background:#fff;color:#D97757;display:grid;place-items:center;font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,119,87,.25)}}
.alerts{position:absolute;left:18px;top:96px;z-index:3;display:flex;flex-direction:column;gap:6px;max-width:min(420px,calc(100% - 36px))}
.alerts button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:#fff;border:1.5px solid #D97757;border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.45;box-shadow:0 2px 8px rgba(20,20,19,.1)}
.alerts button b{flex:none;width:18px;height:18px;border-radius:50%;background:#D97757;color:#fff;display:grid;place-items:center;font-size:12px}
.alerts button:hover{background:#FBEEE5}
.alerts .ok{border-color:#B4B1A7}.alerts .ok b{background:#5E8C61}
.hint{position:absolute;left:18px;bottom:80px;z-index:3;font-size:11px;color:#6B6A63;background:rgba(250,249,245,.9);border:1px solid #E3E1D8;border-radius:8px;padding:5px 9px;line-height:1.5}
.hint b{color:#2A2A28}
.tag em{font-style:normal;color:var(--red)}
/* 控制台：深色机壳 + 左边一排实体按键（带小灯）+ 右边米白屏幕；屏幕里一次只看一块，不用一直往下拉 */
.panel{position:absolute;right:14px;top:84px;bottom:86px;width:440px;z-index:15;display:none;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr;gap:10px;background:#2A2725;border-radius:14px;padding:12px;box-shadow:0 0 0 2px #141413,6px 6px 0 #E8682F;color:var(--ink)}
.panel.on{display:grid}
.panel{resize:both;overflow:hidden;min-width:340px;min-height:320px;max-width:calc(100vw - 20px)}
.panel .ph{cursor:move;user-select:none}
.panel .grip{position:absolute;right:4px;bottom:3px;font-size:12px;color:#8A877E;pointer-events:none}
.panel .ph{grid-column:1/-1;margin:0;display:flex;align-items:center;justify-content:space-between;background:#1E1C1A;border-radius:8px;padding:8px 10px;color:#FAF9F5}
.panel .ph b{font-size:14px;letter-spacing:2px}.panel .ph b small{font-size:10px;color:#B4B1A7;letter-spacing:1px;margin-left:6px;font-weight:400}
.panel .ph>span{display:flex;align-items:center}
.panel .ph .x{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;background:#3D3A37;color:#FAF9F5;display:grid;place-items:center;font-size:14px;margin-left:10px}
.keys{display:flex;flex-direction:column;gap:6px}
.keys button{all:unset;cursor:pointer;position:relative;background:#3D3A37;color:#E3E1D8;font-size:12px;font-weight:700;padding:9px 8px 9px 22px;border-radius:7px;box-shadow:0 3px 0 #141413;transition:transform .08s}
.keys button::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#5F5E5A}
.keys button.on{background:#E8682F;color:#fff;transform:translateY(2px);box-shadow:0 1px 0 #141413}.keys button.on::before{background:#FFE14A;box-shadow:0 0 6px #FFE14A}
.keys button:hover{filter:brightness(1.12)}
.keys .knob{margin-top:auto;display:flex;gap:6px;justify-content:center;padding-top:8px}.keys .knob i{width:14px;height:14px;border-radius:50%;background:#1E1C1A;box-shadow:inset 0 0 0 3px #5F5E5A}.keys .knob i:nth-child(2){box-shadow:inset 0 0 0 3px #F5C400}
.screen{background:var(--panel);border-radius:8px;box-shadow:inset 0 0 0 3px #141413;overflow:auto;padding:14px 14px 16px;min-height:0}
.pane{display:none}.pane.on{display:block}
.pane>.sec{margin-top:0}
.ctab{all:unset;position:absolute;right:14px;top:14px;z-index:16;cursor:pointer;display:flex;align-items:center;gap:7px;background:#2A2725;color:#FAF9F5;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;box-shadow:0 0 0 2px #141413,3px 3px 0 #E8682F}
.ctab::before{content:"";width:8px;height:8px;border-radius:50%;background:#5DCAA5;box-shadow:0 0 6px #5DCAA5}
.ctab.on{background:#E8682F}
.fgrp.att .fgh{cursor:pointer;user-select:none}
.fgrp.att{margin-top:4px;padding:6px 6px 4px}.fgrp.att.fold{display:none}

.st small{font-size:11px;color:var(--sub);margin-left:4px}
.sec{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px}

.crew{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}

.c b{font-size:13px}

.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}

.ln b{font-size:16px}
.ln p{margin:3px 0 0;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln.off{opacity:.55}
.box{background:#fff;border:1px solid var(--line);padding:6px 12px;margin-bottom:20px;cursor:pointer}
.sr{display:grid;grid-template-columns:76px 1fr 46px 58px;gap:8px;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--line)}
.sr:last-child{border-bottom:0}
.sr b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .bar{height:8px;background:#eee;position:relative}
.sr .bar s{position:absolute;inset:0 auto 0 0;display:block}
.sr .n{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.sr .go{font-size:11px;font-weight:700;text-align:center;border-radius:10px;padding:1px 0;color:var(--sub)}
.sr .go.full{background:#FFF4CC;color:#8a6a00}

.dr p{margin:1px 0 0;font-size:11px;color:var(--sub)}
.dr .n{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.dr .n small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}

.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

v><div class=\"flow stl\" id=\"stList\"><\/div><div class=\"note\">点一站开 / 关，再点「保存并刷新」。记在这台设备上；最少留 1 站。<\/div><\/div>\n    <\/div>\n  <\/aside>\n<\/div>\n\n", "js": "\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\n\n// ===== 数据：data/flow.json 里你的流程和数（生成脚本塞进来；还没有就是 templates/ 里的示例）。数据里的字写 xxx_en 就是英文版用的 =====\nconst RAW = window.DATA || { templates: {} };\n// 模板：示例数据时第一次打开先挑一套（存在这台设备上：clawnveyor-template）；有自己的数据时也能「看看别的模板」，点「用回我的数据」回来\nconst TPLS = RAW.templates || {}; let TPL_PICK = null; try { TPL_PICK = localStorage.getItem('clawnveyor-template'); } catch (e) {}\nconst CFG = (TPL_PICK && TPLS[TPL_PICK] && TPL_PICK !== RAW.id) || (TPL_PICK && TPLS[TPL_PICK] && RAW.sample) ? { ...TPLS[TPL_PICK], preview: !RAW.sample } : RAW;\nconst EN = window.LANG === 'en', tx = (o, k) => (o && ((EN && o[k + '_en']) || o[k])) || '';\nconst ROLE_DEF = { dock: '揽收员', lane: '分拣员', boss: '馆长', shop: '集包员', prep: '加工员', guard: '门卫', desk: '取件员', agent: '项目小克' };\nconst D = (c => { const k = c.counts || {}, outs = c.outputs || [], main = outs.find(o => o.main) || outs[0], sh0 = c.shelf || [], lk = c.links || {};\n  const roles = { ...ROLE_DEF, ...((EN && c.roles_en) || c.roles || {}) }, lanes = (c.lanes || []).concat([1, 2, 3].map(i => roles.lane + '-' + i)).slice(0, 3);\n  return { gen: c.gen || '', id: c.id || '', title: tx(c, 'title') || '克鸟驿站', unit: tx(c, 'unit') || '件', sample: !!c.sample, preview: !!c.preview,\n    stations: c.stations || [], roles, lanes, boss: c.boss || roles.boss,\n    sources: (c.sources || []).map(x => ({ 名字: x.name, 英文: x.en || x.name, 克递员: x.worker || '', 颜色: x.color || '', 网站: x.url || '', 路线: (EN && x.steps_en) || x.steps || [], 规矩: tx(x, 'rule'), new: !!x.new })),\n    crew: Object.fromEntries(Object.entries(c.crew || {}).map(([n, v]) => [n, { ...v, text: tx(v, 'text') }])),\n    sort: { 卸货中: k.unloading || 0, 待拣: k.wai ) {}\n  const h = /st=([\\d,]+)/.exec(location.hash); if (h) s = h[1];\n  if (s) { const on = s.split(',').map(Number).filter(n => n >= 1 && n <= ST_ORDER.length).map(n => ST_ORDER[n - 1]); if (on.length) return on; }\n  const on = ST_ORDER.filter(id => { const c = D.stations.find(x => x.id === id); return c ? c.on !== false : !D.stations.length; }); return on.length ? on : ST_ORDER.slice(); })();\nconst SI = Object.fromEntries(ST_ORDER.map((id, i) => { const c = D.stations.find(x => x.id === id) || {}, d = ST_DEF[id];\n  return [id, { id, no: String(i + 1).padStart(2, '0'), name: tx(c, 'name') || (EN ? d[1] : d[0]), en: c.en || d[2], desc: tx(c, 'desc') || (EN ? d[4] : d[3]), on: ST_ON.includes(id) }]; }));\nconst zl = id => EN ? SI[id].en : `${SI[id].name}区  ${SI[id].en}`;   // 地上的区名\n// 每一站占哪几块地 [站, x0, x1, z0, z1]：从上往下先对上的算；都没对上的（地板、喵喵、控制台亭子）不算哪一站。数字照场景里东西的位置量的，挪了东西要跟着改\nconst ST_AREA = [['store', 7.3, 12.2, -4.2, -2.6], ['store', 12.2, 24.8, -12.75, -.1], ['shop', -13, 17.5, -19.6, -12.75], ['make', -25, -13, -19.6, -11.6], ['make', -25, -17.25, -11.6, -6.25],\n  ['use', -25, -7.4, -11.6, -.1], ['dock', -25, -7.3, 4.4, 19.6], ['dock', -25, -14.6, -.1, 4.4], ['sort', -7.3, 17.2, -11, 19.6], ['sort', 17.2, 23.2, 6.6, 11.8]];\nconst stAt = (x, z) => { for (const [id, x0, x1, z0, z1] of ST_AREA) if (x >= x0 && x < x1 && z >= z0 && z < z1) return id; return null; };\nconst OFF = id => !!id && SI[id] && !SI[id].on, offAt = (x, z) => OFF(stAt(x, z));\nlet GRAYS = null;   // 没开的站换上的灰色材质（换配色时跟着重算）\nconst esc = s => String(s ?? '').replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c]);\n// 码头：数据里 sources 一行一辆车；来源多了车距自动变小（最多摆得下 6 辆，再多就要另开一排码头）\n// 放不下就收进 MORE 台子（用户 2026-10-18）：场景里每一排「一样一个」的东西都算好最多摆几个（见 大框架.md「每排最多几个」），超过就最后一格换成 MORE 台子，点开看全部\nconst capAt = (list, max) => list.length <= max ? { show: list, rest: [] } : { show: list.slice(0, max - 1), rest: list.slice(max - 1) };\nconst MORES = [], MORE_T = (n, what) => `还有 ${n} 个${what}没摆出来`;\nfunction moreStand(x, z, rest, w, d, what, lines, by = 2.4) {   // 一个台子 + 几箱货 + MORE 牌子；点了列出没摆出来的那几个\n  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);\n  add(new THREE.BoxGeometry(w, .3, d), M('#3B3E40', .8), 0, .15, 0, g); add(new THREE.BoxGeometry(w + .08, .05, d + .08), mat.line, 0, .32, 0, g);\n  for (let k = 0; k < Math.min(5, rest.length + 1); k++) add(CARTON, vcMat, (k % 3 - 1) * Math.min(.7, w / 3.4), .56 + Math.floor(k / 3) * .43, (k % 2 ? .14 : -.14) * Math.min(1, d), g);\n  board([['MORE', .62], [`+${rest.length}`, .34]], x, by, z + Math.min(.4, d / 3), Math.min(1.8, w), Math.min(1.8, w) / .9, '', '', 0, false, .34);\n  MORES.push([x, 1.1, z, w, 2.4, d, { card: { title: MORE_T(rest.length, what), lines } }]); }\nconst SRC_ALL = D.sources.length ? D.sources : [{ 名字: '来源 1', 英文: 'Source 1', 克递员: '', 颜色: '#2F9FD8', 网站: '', 路线: [] }];\nconst SRCF = capAt(SRC_ALL, 10), SRC = SRCF.show, NDOCK = SRC.length + (SRCF.rest.length ? 1 : 0);   // 码头最多 10 辆车（压到最窄）\n// 揽收两个入口（用户 2026-10-18）：A 口 = 之字线，B 口 = 侧面并进来的那条线；默认前一半卡车进 A、后一半进 B，点卡车能改（存在换装台那份数据 gates 里）\nconst GATE = {}, gateOf = k => GATE[SRC[k].名字] || (k < Math.ceil(SRC.length / 2) ? 'A' : 'B');\n// 码头一排（用户 2026-10-18）：放得下就正常大小；车多了放不下，才把每辆车压窄一点（最窄压到 0.55）\nconst DOCK_Z0 = 13.4, DOCK_SPAN = 11.6, DOCK_NEED = 2.1;\nconst dockGap = NDOCK > 1 ? Math.min(3.4, DOCK_SPAN / (NDOCK - 1)) : 0, dockS = Math.max(.55, Math.min(1, (dockGap || DOCK_NEED) / DOCK_NEED));\nconst SPARE = ['#E2412B', '#8A5CF6', '#2F9FD8', '#D4A017', '#C2185B', '#4E7D2F'];\nconst DOCKS = SRC.map((c, i) => [c.克递员, c.名字, DOCK_Z0 - i * dockGap, c.颜色 || SPARE[i % SPARE.length], (c.英文 || c.名字).slice(0, 2).toUpperCase(), c]);\nconst crewOf = n => D.crew[n] || null;\nconst LANERS = D.lanes.map(n => { const c = crewOf(n); return { n, c, on: !!(c && c.active) }; });\nconst anyOn = Object.values(D.crew).some(c => c.active);\nconst CARS = D.cars, DEST = D.dest;\nconst GUIDE0 = D.guide, USE0 = D.use;   // 加工站、送达站的「下一站」网址（data/flow.json 的 links，没填就不显示按钮）\n\nconst isPhone = matchMedia('(max-width:820px), (pointer:coarse)').matches;\nconst yard = document.getElementById('yard'), stage = document.getElementById('stage');\nconst renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });\nrenderer.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 1.5 : 2));\nrenderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;\nrenderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;\nstage.appendChild(renderer.domElement);\n\nconst scene = new THREE.Scene(); scene.background = new THREE.Color('#EDE6DA');\nconst camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);\n// 竖屏（手机）从侧面看：整座仓库的长边竖过来，全景能放大一倍多；横屏（电脑）照旧斜 45° 看\nconst portrait = () => yard.clientWidth < yard.clientHeight;\nconst CAM_PC = new THREE.Vector3(36, 34, 36), CAM_PHONE = CAM_PC;   // 用户 2026-10-17：窗口变窄也用同一个角度看，牌子、字都不跟着转\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true; controls.dampingFactor = .08; controls.enablePan = true; controls.screenSpacePanning = true;\ncontrols.minPolarAngle = .5; controls.maxPolarAngle = 1.2; controls.minZoom = .8; controls.maxZoom = 5;\nconst CENTER = new THREE.Vector3(0, 1.5, 0);\n// 全景：只框住真的有东西的地方（空地板角落可以切掉），算出中心和大小，保证 zoom=1 时东西一点不被切\nconst BOXES = [];   // [x0,x1, y0,y1, z0,z1]，下面搭场景时登记\nconst FT = [], BD = [], ZS = [];   // 地上的字、竖着的牌子：手机竖屏换了看的方向，要跟着转，才读得出来\nconst boxPts = () => { const out = []; for (const [x0, x1, y0, y1, z0, z1] of BOXES) for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) out.push(new THREE.Vector3(x, y, z)); return out; };\nlet W = 1, H = 1, CAM_DIR = CAM_PC;\nfunction fit() {\n  W = yard.clientWidth; H = yard.clientHeight; const a = W / H; CAM_DIR = portrait() ? CAM_PHONE : CAM_PC;\n  const pts = boxPts(); if (!pts.length) pts.push(new THREE.Vector3(-25, 0, -19), new THREE.Vector3(25 \/div>\n    <div class=\"foot\">\n      <button class=\"btn ghost\" id=\"tidyBtn\">Tidy up (delete yours / hide built-ins)<\/button>\n      <button class=\"btn ghost\" id=\"resetRole\">Reset this role<\/button>\n      <button class=\"btn ghost\" id=\"unhide\">Restore hidden<\/button>\n    <\/div>\n    <div class=\"msg\" id=\"saveMsg\"><\/div>\n  <\/aside>\n\n  <button class=\"ctab\" id=\"ctab\">Console<\/button>\n  <aside class=\"panel\" id=\"console\" aria-label=\"Console\">\n    <div class=\"ph\"><b>Console<small>CLAWNVEYOR<\/small><\/b><span><span class=\"live\" id=\"live\">Open<\/span><button class=\"x\" id=\"cX\" aria-label=\"Collapse\">×<\/button><\/span><\/div>\n    <div class=\"keys\" id=\"keys\">\n      <button data-p=\"flow\" class=\"on\">Flow<\/button><button data-p=\"stats\">Today<\/button><button data-p=\"lanes\">Lanes<\/button><button data-p=\"doors\">Doors<\/button><button data-p=\"shop\">Carts<\/button><button data-p=\"crew\">Crew<\/button><button data-p=\"log\">Log<\/button><button data-p=\"st\">Stations<\/button>\n      <div class=\"knob\"><i><\/i><i><\/i><i><\/i><\/div>\n    <\/div>\n    <span class=\"grip\">◢<\/span>\n    <div class=\"screen\">\n      <div class=\"pane on\" data-pane=\"flow\"><div class=\"sec\"><span>Flow<\/span><span>Click to fly there · ▾ sub-steps<\/span><\/div><div class=\"flow\" id=\"flow\"><\/div><div class=\"nx\" id=\"nextStops\" hidden><\/div><\/div>\n      <div class=\"pane\" data-pane=\"stats\"><div class=\"sec\"><span>Today<\/span><span>What came in and got sorted today<\/span><\/div><div class=\"stats\" id=\"stats\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"lanes\"><div class=\"sec\"><span>Three sorting lanes<\/span><span>Who is sorting what<\/span><\/div><div class=\"lanes\" id=\"lanes\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"doors\"><div class=\"sec\"><span>Doors · destinations<\/span><span>Notes per destination<\/span><\/div><div class=\"box\" id=\"doors\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"shop\"><div class=\"sec\"><span>04 Pack · carts<\/span><span>Full carts drive off to processing<\/span><\/div><div class=\"box\" id=\"shopList\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"crew\"><div class=\"sec\"><span>Crew<\/span><span>Who is busy, who is slacking · click to fly there<\/span><\/div><div class=\"crew\" id=\"crew\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"log\"><div class=\"sec\"><span>Station log<\/span><span>Newest first<\/span><\/div><div class=\"log\" id=\"log\"><\/div><div class=\"note\" id=\"note\"><\/div><\/div>\n      <div class=\"pane\" data-pane=\"st\"><div class=\"sec\"><span>Templates<\/span><span>Stations, names and sample data<\/span><\/div><div class=\"flow stl\" id=\"tplList\"><\/div><div class=\"sec\" style=\"margin-top:14px\"><span>Station switches<\/span><span>Switched-off stations stay in place, greyed out with a PAUSED sign<\/span><\/div><div class=\"flow stl\" id=\"stList\"><\/div><div class=\"note\">Tap a station to switch it on / off, then tap “Save & reload”. Saved on this device; keep at least 1.<\/div><\/div>\n    <\/div>\n  <\/aside>\n<\/div>\n\n", "js": "\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\n\n// ===== 数据：data/flow.json 里你的流程和数（生成脚本塞进来；还没有就是 templates/ 里的示例）。数据里的字写 xxx_en 就是英文版用的 =====\nconst RAW = window.DATA || { templates: {} };\n// 模板：示例数据时第一次打开先挑一套（存在这台设备上：clawnveyor-template）；有自己的数据时也能「看看别的模板」，点「用回我的数据」回来\nconst TPLS = RAW.templates || {}; let TPL_PICK = null; try { TPL_PICK = localStorage.getItem('clawnveyor-template'); } catch (e) {}\nconst CFG = (TPL_PICK && TPLS[TPL_PICK] && TPL_PICK !== RAW.id) || (TPL_PICK && TPLS[TPL_PICK] && RAW.sample) ? { ...TPLS[TPL_PICK], preview: !RAW.sample } : RAW;\nconst EN = window.LANG === 'en', tx = (o, k) => (o && ((EN && o[k + '_en']) || o[k])) || '';\nconst ROLE_DEF = { dock: 'Fetcher', lane: 'Sorter', boss: 'Curator', shop: 'Packer', prep: 'Maker', guard: 'Guard', desk: 'Courier', agent: 'Project Clawd' };\nconst D = (c => { const k = c.counts || {}, outs = c.outputs || [], main = outs.find(o => o.main) || outs[0], sh0 = c.shelf || [], lk = c.links || {};\n  const roles = { ...ROLE_DEF, ...((EN && c.roles_en) || c.roles || {}) }, lanes = (c.lanes || []).concat([1, 2, 3].map(i => roles.lane + '-' + i)).slice(0, 3);\n  return { gen: c.gen || '', id: c.id || '', title: tx(c, 'title') || 'Clawnveyor', unit: tx(c, 'unit') || 'items', sample: !!c.sample, preview: !!c.preview,\n    stations: c.stations || [], roles, lanes, boss: c.boss || roles.boss,\n    sources: (c.sources || []).map(x => ({ 名字: x.name, 英文: x.en || x.name, 克递员: x.worker || '', 颜色: x.color || '', 网站: x.url || '', 路线: (EN && x.steps_en) || x.steps || [], 规矩: tx(x, 'rule'), new: !!x.new })),\n    crew: Object.fromEntries(Object.entries(c.crew || {}).map(([n, v]) => [n, { ...v, text: tx(v, 'text') }])),\n    sort: { 卸货中: k.unloading || 0, 待拣: k.waiting || 0, 已上架: k.done || 0, 今日上架: k.today_done || 0, 今日寄出: k.today_in || 0, 今日退回: k.today_returned || 0 },\n    notes: k.stored ?? (main ? main.count || 0 : 0),\n    dest: outs.map(o => ({ 名字: tx(o, 'name'), 颜色: o.color || '#E03C31', 一句话: tx(o, 'note'), 条数: o.count || 0, 网页: o.url || '', 送去: o.where || '', 进加工: o.process !== false })),\n    main: main ? tx(main, 'name') : '',\n    cars: (c.carts || []).map(x => ({ 名字: tx(x, 'name'), 颜色: x.color || '#888888', 门槛: x.need || 10, 装了: x.have || 0, 满了: (x.have || 0) >= (x.need || 10), 网页: x.url || '' })),\n    guide: { url: (lk.make && lk.make.url) || '', name: tx(lk.make, 'name'), mine: sh0.reduce((a, x) => a + (x.mine || 0), 0), all: sh0.reduce((a, x) => a + (x.all || 0), 0), shelf: sh0.map(x => [tx(x, 'name'), x.mine || 0, x.all || 0]) },\n    use: { url: (lk.use && lk.use.url) || '', name: tx(lk.use, 'name'), projects: (c.projects || []).length, names: (EN && c.projects_en) || c.projects || [] },\n    log: (c.log || []).map(l => ({ ...l, what: tx(l, 'what') })) }; })(CFG);\nconst UNIT = D.unit;\n// ===== 站点（通用版）：6 站摆在固定的位置（和原版一样，不重新排路）。没开的站不收起来：原地变灰、拉黄黑警戒带、站牌上盖「暂停」，里面没人、东西不动 =====\n// 开哪几站：网址 #st=1,2,3 > 这台设备存的（控制台「站点」那块点的）> 数据里 stations[].on > 全开。编号 01～06 跟着位置走，关了也不重排\nconst ST_ORDER = ['dock', 'sort', 'store', 'shop', 'make', 'use'];\nconst ST_DEF = { dock: ['Pickup', 'Pickup', 'PICKUP', '去各个来源收东西', 'Bring things in from each source'], sort: ['Sort', 'Sort', 'SORTING', '一件件看，分到各自的去处', 'Look at each item and send it where it belongs'],\n  store: ['Store', 'Store', 'STORAGE', '处理好的存进库里', 'Finished items go into the library'], shop: ['Pack', 'Pack', 'CONSOLIDATION', '按类别装车，一类一辆，攒够门槛亮灯', 'One cart per topic; a full cart lights up'],\n  make: ['Process', 'Process', 'PROCESS', '满了的车开过来，做成成品、上架', 'Full carts come in and become finished goods on the shelf'], use: ['Deliver', 'Deliver', 'DELIVERY', '送到每个项目手里', 'Delivered to every project'] };\nconst ST_ON = (() => { let s = null; try { s = localStorage.getItem('clawnveyor-stations'); } catch (e) {}\n  const h = /st=([\\d,]+)/.exec(location.hash); if (h) s = h[1];\n  if (s) { const on = s.split(',').map(Number).filter(n => n >= 1 && n <= ST_ORDER.length).map(n => ST_ORDER[n - 1]); if (on.length) return on; }\n  const on = ST_ORDER.filter(id => { const c = D.stations.find(x => x.id === id); return c ? c.on !== false : !D.stations.length; }); return on.length ? on : ST_ORDER.slice(); })();\nconst SI = Object.fromEntries(ST_ORDER.map((id, i) => { const c = D.stations.find(x => x.id === id) || {}, d = ST_DEF[id];\n  return [id, { id, no: String(i + 1).padStart(2, '0'), name: tx(c, 'name') || (EN ? d[1] : d[0]), en: c.en || d[2], desc: tx(c, 'desc') || (EN ? d[4] : d[3]), on: ST_ON.includes(id) }]; }));\nconst zl = id => EN ? SI[id].en : `${SI[id].name}区  ${SI[id].en}`;   // 地上的区名\n// 每一站占哪几块地 [站, x0, x1, z0, z1]：从上往下先对上的算；都没对上的（地板、喵喵、控制台亭子）不算哪一站。数字照场景里东西的位置量的，挪了东西要跟着改\nconst ST_AREA = [['store', 7.3, 12.2, -4.2, -2.6], ['store', 12.2, 24.8, -12.75, -.1], ['shop', -13, 17.5, -19.6, -12.75], ['make', -25, -13, -19.6, -11.6], ['make', -25, -17.25, -11.6, -6.25],\n  ['use', -25, -7.4, -11.6, -.1], ['dock', -25, -7.3, 4.4, 19.6], ['dock', -25, -14.6, -.1, 4.4], ['sort', -7.3, 17.2, -11, 19.6], ['sort', 17.2, 23.2, 6.6, 11.8]];\nconst stAt = (x, z) => { for (const [id, x0, x1, z0, z1] of ST_AREA) if (x >= x0 && x < x1 && z >= z0 && z < z1) return id; return null; };\nconst OFF = id => !!id && SI[id] && !SI[id].on, offAt = (x, z) => OFF(stAt(x, z));\nlet GRAYS = null;   // 没开的站换上的灰色材质（换配色时跟着重算）\nconst esc = s => String(s ?? '').replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c]);\n// 码头：数据里 sources 一行一辆车；来源多了车距自动变小（最多摆得下 6 辆，再多就要另开一排码头）\n// 放不下就收进 MORE 台子（用户 2026-10-18）：场景里每一排「一样一个」的东西都算好最多摆几个（见 大框架.md「每排最多几个」），超过就最后一格换成 MORE 台子，点开看全部\nconst capAt = (list, max) => list.length <= max ? { show: list, rest: [] } : { show: list.slice(0, max - 1), rest: list.slice(max - 1) };\nconst MORES = [], MORE_T = (n, what) => `${n} more ${what} (not shown)`;\nfunction moreStand(x, z, rest, w, d, what, lines, by = 2.4) {   // 一个台子 + 几箱货 + MORE 牌子；点了列出没摆出来的那几个\n  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);\n  add(new THREE.BoxGeometry(w, .3, d), M('#3B3E40', .8), 0, .15, 0, g); add(new THREE.BoxGeometry(w + .08, .05, d + .08), mat.line, 0, .32, 0, g);\n  for (let k = 0; k < Math.min(5, rest.length + 1); k++) add(CARTON, vcMat, (k % 3 - 1) * Math.min(.7, w / 3.4), .56 + Math.floor(k / 3) * .43, (k % 2 ? .14 : -.14) * Math.min(1, d), g);\n  board([['MORE', .62], [`+${rest.length}`, .34]], x, by, z + Math.min(.4, d / 3), Math.min(1.8, w), Math.min(1.8, w) / .9, '', '', 0, false, .34);\n  MORES.push([x, 1.1, z, w, 2.4, d, { card: { title: MORE_T(rest.length, what), lines } }]); }\nconst SRC_ALL = D.sources.length ? D.sources : [{ 名字: '来源 1', 英文: 'Source 1', 克递员: '', 颜色: '#2F9FD8', 网站: '', 路线: [] }];\nconst SRCF = capAt(SRC_ALL, 10), SRC = SRCF.sh
